name: Auto Deploy to GCP Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and rebuild
        run: |
          echo "🚀 Starting automated deployment..."
          cd /var/www/SIU
          git checkout package-lock.json
          git pull origin main
          npm run build

          # Sync backend files to /var/www/SIU-Backend if backend runs from there
          if [ -d "/var/www/SIU-Backend" ]; then
            echo "📦 Updating /var/www/SIU-Backend..."
            sudo chown -R admin:admin /var/www/SIU-Backend 2>/dev/null || true
            sudo mkdir -p /var/www/SIU-Backend/routes /var/www/SIU-Backend/models /var/www/SIU-Backend/middleware /var/www/SIU-Backend/config
            sudo cp -r /var/www/SIU/Backend/routes/* /var/www/SIU-Backend/routes/
            sudo cp -r /var/www/SIU/Backend/models/* /var/www/SIU-Backend/models/
            sudo cp -r /var/www/SIU/Backend/middleware/* /var/www/SIU-Backend/middleware/
            sudo cp -r /var/www/SIU/Backend/config/* /var/www/SIU-Backend/config/
            sudo cp /var/www/SIU/Backend/server.js /var/www/SIU-Backend/server.js
          fi

          pm2 restart all || pm2 reload all
          echo "=== PM2 ERROR LOG ===" > /var/www/SIU/dist/debug-backend.txt
          tail -n 80 /home/admin/.pm2/logs/siu-backend-error.log >> /var/www/SIU/dist/debug-backend.txt 2>&1 || true
          echo "=== PM2 OUT LOG ===" >> /var/www/SIU/dist/debug-backend.txt
          tail -n 80 /home/admin/.pm2/logs/siu-backend-out.log >> /var/www/SIU/dist/debug-backend.txt 2>&1 || true
          echo "✅ Deployment completed successfully!"

