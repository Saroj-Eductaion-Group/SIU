name: Auto Deploy to GCP Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and rebuild
        run: |
          echo "🚀 Starting automated deployment..."
          cd /var/www/SIU
          git checkout package-lock.json
          git pull origin main
          npm run build
          pm2 reload all
          echo "✅ Deployment completed successfully!"

