name: Auto Deploy to GCP Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and rebuild
        run: |
          echo "🚀 Starting automated deployment..."
          cd /var/www/SIU
          git checkout package-lock.json
          git pull origin main
          npm run build

          # Sync backend files to /var/www/SIU-Backend where production node service runs
          if [ -d "/var/www/SIU-Backend" ]; then
            echo "📦 Syncing backend to /var/www/SIU-Backend..."
            sudo cp -r /var/www/SIU/Backend/* /var/www/SIU-Backend/
            sudo chown -R admin:admin /var/www/SIU-Backend /var/www/SIU 2>/dev/null || true
            cd /var/www/SIU-Backend && npm install --production || true
            cd /var/www/SIU
          fi

          # Restart production service under pm2-SIU-5 or admin pm2
          sudo systemctl restart pm2-SIU-5.service || true
          pm2 restart all 2>/dev/null || true

          # Diagnostics
          {
            echo "=== PM2 STATUS ==="
            pm2 status 2>&1
            echo "=== SYSTEMCTL STATUS ==="
            sudo systemctl status pm2-SIU-5.service 2>&1 || true
            echo "=== PM2 LOGS ==="
            pm2 logs --lines 30 --nostream 2>&1 || true
          } > /var/www/SIU/dist/debug-backend.txt 2>&1 || true

          # Reload nginx to ensure changes take effect immediately
          sudo systemctl reload nginx 2>/dev/null || true

          echo "✅ Deployment completed successfully!"

